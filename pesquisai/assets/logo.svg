<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="100%" height="100%">
  <defs>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4b56a"/>
      <stop offset="100%" stop-color="#8f7536"/>
    </linearGradient>
    <radialGradient id="core" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#3d4d63"/>
      <stop offset="100%" stop-color="#1f2831"/>
    </radialGradient>
  </defs>

  <rect width="620" height="200" rx="16" fill="#141c24" />

  <g stroke="#26384a" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="200" />
    <line x1="80" y1="0" x2="80" y2="200" />
    <line x1="0" y1="40" x2="620" y2="40" />
    <line x1="0" y1="160" x2="620" y2="160" />
  </g>

  <!-- Emblema: átomo da pesquisa (núcleo + órbitas) -->
  <circle cx="120" cy="100" r="46" fill="#1f2831"/>
  <circle cx="120" cy="100" r="46" fill="none" stroke="#b29149" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="120" cy="100" rx="40" ry="17" fill="none" stroke="url(#orb)" stroke-width="3.5" transform="rotate(-22 120 100)"/>
  <ellipse cx="120" cy="100" rx="40" ry="17" fill="none" stroke="#d4b56a" stroke-width="3.5" transform="rotate(40 120 100)" opacity="0.7"/>
  <circle cx="156" cy="78" r="5.5" fill="#e2c97f"/>
  <circle cx="86" cy="128" r="4.5" fill="#c9a54f"/>
  <circle cx="120" cy="100" r="20" fill="#26384a"/>
  <circle cx="120" cy="100" r="20" fill="none" stroke="#b29149" stroke-width="1.2" opacity="0.7"/>
  <text x="120" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#f4ecd8" text-anchor="middle">A</text>

  <!-- Marca nominativa -->
  <text x="215" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" letter-spacing="-1px">
    <tspan fill="#FFFFFF">UFV</tspan><tspan fill="#d4b56a">AI</tspan>
  </text>

  <text x="217" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#9aa3ad" letter-spacing="2px">
    INTELIGÊNCIA ARTIFICIAL · PESQUISA CIENTÍFICA
  </text>
</svg>
